[project]
name = "care-ops-saas"
version = "0.4.0rc2"
description = "Multi-tenant education operations platform"
requires-python = ">=3.12"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlmodel>=0.0.24,<1",
 "pydantic-settings>=2.8,<3", "email-validator>=2.2,<3", "httpx>=0.28,<1",
 "cryptography>=44", "pwdlib[argon2]>=0.2,<1", "python-multipart>=0.0.20",
 "alembic>=1.15,<2", "psycopg[binary]>=3.2,<4", "celery[redis]>=5.5,<6",
 "boto3>=1.37,<2", "pgvector>=0.4,<1", "defusedxml>=0.7,<1",
 "pydantic-ai-slim[openai]>=2.53.0,<3", "pillow>=11", "openpyxl>=3.1,<4", "qrcode[pil]>=8,<9", "reportlab>=5,<6", "pypdf>=6.21.2,<7"
]
[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=6", "pip-audit>=2.9"]
ocr = ["paddleocr>=3.0,<4", "paddlepaddle>=3.0,<4", "pypdfium2>=5,<6"]
publisher = ["playwright>=1.51,<2"]
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
app = ["static/*"]
