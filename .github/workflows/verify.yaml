name: Verify delivery candidate
on: [push, pull_request, workflow_dispatch]
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env: {POSTGRES_PASSWORD: ci-only-test-password, POSTGRES_DB: ops_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d ops_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: "24", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - name: Install CJK renderer font
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk ffmpeg
      - name: Install locked dependencies
        run: |
          python -m pip install pip==26.2.1
          python -m pip install --require-hashes -r backend/requirements-test.lock
          python -m pip install --require-hashes -r publisher/requirements-resolved.lock
          python -m pip install --no-deps -e ./backend
          npm ci --prefix frontend
          python scripts/configure.py
      - name: API, native PostgreSQL, vector and RLS
        env:
          OPS_TEST_POSTGRES_URL: postgresql://postgres:ci-only-test-password@127.0.0.1:5432/ops_test
        run: |
          python -m pytest backend/tests -q --junitxml=docs/matrix-api-tests.xml
          python scripts/test-postgres.py
          node frontend/test-rls.mjs
          node frontend/test-migration.mjs
          node frontend/test-matrix-migration.mjs
          python scripts/test-matrix-media.py
      - name: Build and browser workflows
        run: |
          npm run build --prefix frontend
          python -m app.cli demo
          python -m app.cli openapi
          npm run generate-client --prefix frontend
          npx --prefix frontend playwright install --with-deps chromium
          OPS_PUBLIC_URL=http://127.0.0.1:8188 python -m uvicorn app.main:app --host 127.0.0.1 --port 8188 --no-access-log > /tmp/ops-preview.log 2>&1 &
          for i in $(seq 1 30); do if curl -fsS http://127.0.0.1:8188/api/v1/health >/dev/null; then break; fi; sleep 1; done
          npm test --prefix frontend
      - name: Dependency audit
        run: |
          python -m pip_audit -r backend/requirements-resolved.lock --no-deps --disable-pip --format json -o docs/pip-audit.json
          python -m pip_audit -r publisher/requirements-resolved.lock --no-deps --disable-pip --format json -o docs/publisher-dependency-audit.json
          python -m pip_audit -r publisher/requirements-gateway-resolved.lock --no-deps --disable-pip --format json -o docs/gateway-dependency-audit.json
          npm audit --prefix frontend --audit-level=high
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with: {go-version: "1.27.3", cache-dependency-path: publisher/vendor/xiaohongshu/go.sum}
      - name: MCP source, protocol and reachability checks
        run: |
          PLAYWRIGHT_BROWSERS_PATH=$PWD/.local/browsers python -m playwright install --with-deps chromium
          mkdir -p .local
          cd publisher/vendor/xiaohongshu
          go mod verify
          go test ./... -run 'Test.*(Parse|Cookies|Middleware|Routes|Validate|Mask|Title)' -count=1
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck -json ./... > ../../../docs/xhs-go-linux-vuln-report.jsonl
          go build -trimpath -o ../../../.local/xiaohongshu-mcp .
          cd ../../..
          PUB_XHS_BINARY=$PWD/.local/xiaohongshu-mcp python scripts/test-mcp-runtime.py
      - name: Build Linux application image
        run: docker build -t care-ops:ci .
      - uses: aquasecurity/trivy-action@6abccf398f78b4c337599c0656f933d91efb91a0
        with:
          image-ref: care-ops:ci
          format: json
          output: docs/image-audit.json
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Build Linux publisher image
        run: docker build -f publisher/Dockerfile -t care-ops-publisher:ci .
      - uses: aquasecurity/trivy-action@6abccf398f78b4c337599c0656f933d91efb91a0
        with:
          image-ref: care-ops-publisher:ci
          format: json
          output: docs/publisher-image-audit.json
          severity: HIGH,CRITICAL
          exit-code: "1"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verification-evidence
          path: |
            docs/*report.*
            docs/*audit.json
            docs/screenshots/
            docs/matrix-*
            docs/migration-upgrade-0005.sql
